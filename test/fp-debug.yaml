apiVersion: v1
kind: Pod
metadata:
  name: fp-debug-test
  labels:
    agente.monitoreo/habilitado: "true"
spec:
  containers:
  - name: app
    image: docker.io/library/victima-test:latest
    imagePullPolicy: Never
    command: ["/bin/sh", "-c", "sleep infinity"]
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      runAsUser: 1000
      capabilities:
        add: ["SYS_PTRACE"]
